<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doodax.com - The ultimate live currency converter and financial guide. Get real-time exchange rates, read in-depth economic articles, and manage your finances with our professional tools.">
    <title>Doodax | Live Currency Converter & Financial Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/"
      }
    }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        color: #1f2937;
        background-color: #0f0c29;
      }

      /* Multi-colored Galaxy Background */
      .galaxy-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #4a1c40, #1a1a2e, #0f0c29);
        background-size: 400% 400%;
        animation: gradientBG 20s ease infinite;
      }

      /* Nebula Clouds */
      .nebula {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
          radial-gradient(circle at 20% 30%, rgba(76, 29, 149, 0.4) 0%, transparent 40%),
          radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.3) 0%, transparent 30%),
          radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.2) 0%, transparent 40%),
          radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.3) 0%, transparent 30%);
        filter: blur(20px);
        animation: nebulaPulse 10s ease-in-out infinite alternate;
      }

      .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
          radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 40px 70px, #fff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 90px 40px, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0));
        background-repeat: repeat;
        background-size: 200px 200px;
        opacity: 0.6;
        animation: twinkle 4s infinite ease-in-out;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes nebulaPulse {
        0% { opacity: 0.7; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.1); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.4; transform: translateY(0); }
        50% { opacity: 0.8; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a2e;
      }
      ::-webkit-scrollbar-thumb {
        background: #4f46e5;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4338ca;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="galaxy-bg"></div>
    <div class="nebula"></div>
    <div class="stars"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
